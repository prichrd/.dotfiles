set-option -g status-position bottom
set-option -g status-left "#[fg=cyan,bg=default][#S] "
set-option -g status-left-length 100
set-option -g status-right '#(~/.local/bin/tmux-claude-status) #(~/.local/bin/tmux-git-status)'
set-option -g status-right-length 100
set-option -g status-interval 5
set-option -g status-style fg=cyan,bg=default
set-option -g detach-on-destroy off
set-option -g history-limit 5000
set-option -g escape-time 10
set-window-option -g window-status-current-style fg=magenta,bg=default

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Session/window picker: colored status dot first, then the name.
# yellow = Claude needs input, blue = Claude working, green = Claude idle, grey = other
set -g @dot-pane '#{?#{==:#{pane_pb_state},paused},#[fg=#e0af68],#{?#{==:#{pane_pb_state},indeterminate},#[fg=#7aa2f7],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#[fg=#9ece6a],#[fg=#3b4261]}}}●#[default]'
set -g @dot-session '#{?#{m:*paused*,#{W:#{pane_pb_state} }},#[fg=#e0af68],#{?#{m:*indeterminate*,#{W:#{pane_pb_state} }},#[fg=#7aa2f7],#{?#{m/r:(^| )[0-9]+\.[0-9]+\.[0-9]+ ,#{W:#{pane_current_command} }},#[fg=#9ece6a],#[fg=#3b4261]}}}●#[default]'
bind-key w choose-tree -swZ -F '#{?pane_format,#{E:@dot-pane} #{pane_current_command},#{?window_format,#{E:@dot-pane} #{window_name},#{E:@dot-session} #{session_windows} windows#{?session_attached, #[fg=#565f89]attached,}}}'



set -g base-index 1

setw -g mode-keys vi
setw -g pane-base-index 1
setw -g mouse on

bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r t display-popup -T "Launcher" -E "$HOME/.local/bin/tmux-launcher"
bind -r W display-popup -T "New Worktree" -E "$HOME/.local/bin/tmux-worktree"
bind -r N run-shell "$HOME/.local/bin/tmux-claude-next"
bind -r C new-session

set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-command /bin/zsh
set -g default-shell /bin/zsh
set -g focus-events on

# Bell monitoring for Claude notifications
set-option -g visual-bell off
set-option -g bell-action other
set-window-option -g monitor-bell on

# Tokyo Night theme (matches Ghostty palette)
set -g status-style "fg=#7dcfff,bg=#16161e"
set -g message-style "fg=#c0caf5,bg=#292e42"
set -g message-command-style "fg=#c0caf5,bg=#292e42"
set -g mode-style "fg=#c0caf5,bg=#33467c"
set -g menu-style "fg=#c0caf5,bg=#1f2335"
set -g menu-selected-style "fg=#c0caf5,bg=#33467c"
set -g menu-border-style "fg=#3b4261,bg=#1f2335"
set -g popup-style "fg=#c0caf5,bg=#1a1b26"
set -g popup-border-style "fg=#3b4261,bg=#1a1b26"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g tree-mode-border-style "fg=#3b4261,bg=#1a1b26"
set -g tree-mode-preview-style "fg=#7aa2f7"
set -g display-panes-border-style "fg=#3b4261,bg=#1a1b26"
set -g display-panes-colour "#565f89"
set -g display-panes-active-colour "#7aa2f7"
set -g clock-mode-colour "#7aa2f7"
set -g copy-mode-match-style "fg=#1a1b26,bg=#7dcfff"
set -g copy-mode-current-match-style "fg=#1a1b26,bg=#ff9e64"
set -g copy-mode-mark-style "fg=#1a1b26,bg=#bb9af7"
set -g window-status-bell-style "fg=#e0af68,bold"
set -g window-status-activity-style "fg=#e0af68"

# Claude Code: show its session title as the window name / terminal title,
# and forward OSC 9;4 progress bars to Ghostty
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{=/30/…:pane_title},#{pane_current_command}}'
set -g set-titles on
set -g set-titles-string "#T"
set -as terminal-features ",xterm-256color:progressbar"
